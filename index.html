<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1412" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f4f6f3" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="健身紀錄">
<title>健身紀錄</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --surface-2: #eceff0;
  --line: #dde2df;
  --text: #16201b;
  --muted: #5f6b65;
  --accent: #2f8f4e;
  --accent-ink: #ffffff;
  --accent-soft: #dcf0e2;
  --danger: #c43d32;
  --warn: #b7791f;
  --radius: 14px;
  --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1412;
    --surface: #18201c;
    --surface-2: #222b26;
    --line: #2c3631;
    --text: #e8eee9;
    --muted: #93a199;
    --accent: #7ddc8f;
    --accent-ink: #0c1a10;
    --accent-soft: #1f3a27;
    --danger: #ff7a6b;
    --warn: #f0b955;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1412;
  --surface: #18201c;
  --surface-2: #222b26;
  --line: #2c3631;
  --text: #e8eee9;
  --muted: #93a199;
  --accent: #7ddc8f;
  --accent-ink: #0c1a10;
  --accent-soft: #1f3a27;
  --danger: #ff7a6b;
  --warn: #f0b955;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  font-size: 16px;
  line-height: 1.45;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
  -webkit-text-size-adjust: 100%;
}
.num { font-variant-numeric: tabular-nums; }
header.top {
  position: sticky; top: 0; z-index: 5;
  background: var(--bg);
  padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  border-bottom: 1px solid var(--line);
}
header.top h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
header.top .sub { color: var(--muted); font-size: 13px; }
main { max-width: 640px; margin: 0 auto; padding: 16px; }
section.view { display: none; }
section.view.active { display: block; }
h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 24px 4px 8px; letter-spacing: .03em; }
h2:first-child { margin-top: 4px; }
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.row { display: flex; gap: 10px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
button {
  font: inherit; color: inherit; cursor: pointer;
  border: 1px solid var(--line); background: var(--surface-2);
  border-radius: 12px; padding: 10px 14px; min-height: 44px;
}
button:active { transform: scale(.98); }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
button.ghost { background: transparent; }
button.danger { color: var(--danger); }
button.block { width: 100%; }
button.big { min-height: 56px; font-size: 18px; }
button.icon { min-width: 44px; padding: 8px; }
button.link { background: none; border: 0; color: var(--accent); padding: 4px 0; min-height: 0; font-weight: 600; }
label.field { display: block; }
label.field span { display: block; font-size: 13px; color: var(--muted); margin: 0 0 4px 2px; }
input, select, textarea {
  font: inherit; color: var(--text);
  background: var(--surface-2); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px 12px; min-height: 44px; width: 100%;
}
textarea { resize: none; line-height: 1.4; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 6px; scrollbar-width: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 36px; padding: 6px 14px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line); font-size: 14px;
}
.chip.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; font-weight: 700; }
.chip.on.warn { background: var(--warn); color: #1a1205; }
.chip.on.danger { background: var(--danger); color: #fff; }
.stat { display: flex; flex-direction: column; }
.stat .v { font-size: 28px; font-weight: 800; line-height: 1.1; }
.stat .u { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 2px; }
.stat .l { font-size: 13px; color: var(--muted); }
.badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.badge.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.badge.danger { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
.badge.neutral { background: var(--surface-2); color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.list-item { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.list-item:first-child { border-top: 0; }

/* exercise card */
.ex-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ex-head .name { font-weight: 700; font-size: 17px; }
.ex-meta { font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.ex-reason { font-size: 13px; padding: 8px 10px; border-radius: 10px; margin-bottom: 10px; background: var(--surface-2); }
.ex-reason.up { background: var(--accent-soft); }
.ex-reason.down { background: color-mix(in srgb, var(--warn) 16%, transparent); }
.set-row { display: grid; grid-template-columns: 28px 1fr 1fr 52px; gap: 8px; align-items: center; margin-bottom: 8px; }
.set-row .idx { text-align: center; color: var(--muted); font-weight: 700; }
.set-row input { text-align: center; font-size: 18px; font-weight: 700; padding: 8px 4px; }
.set-row .chk { min-height: 48px; padding: 0; font-size: 20px; }
.set-row.done input { background: var(--accent-soft); border-color: transparent; }
.set-row.done .chk { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.set-head { display: grid; grid-template-columns: 28px 1fr 1fr 52px; gap: 8px; font-size: 12px; color: var(--muted); text-align: center; margin-bottom: 4px; }
.feel { display: flex; gap: 6px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
.feel .chip { min-height: 32px; padding: 4px 10px; font-size: 13px; }

/* exercise picker */
.ex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.ex-btn { text-align: left; min-height: 48px; font-size: 15px; padding: 8px 12px; }
.pick-group { font-size: 13px; color: var(--muted); font-weight: 700; margin: 16px 0 6px 2px; }
.pick-group:first-child { margin-top: 4px; }
.sheet-head { position: sticky; top: -16px; background: var(--surface); margin: -16px -16px 0; padding: 16px 16px 4px; z-index: 1; }

/* coach */
.msg { max-width: 90%; padding: 10px 12px; border-radius: 16px; margin: 8px 0; word-wrap: break-word; }
.msg.me { margin-left: auto; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; white-space: pre-wrap; }
.msg.ai { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.ai p { margin: 0 0 8px; }
.msg.ai p:last-child { margin-bottom: 0; }
.msg.sys { max-width: 100%; text-align: center; color: var(--muted); font-size: 13px; }
.msg.err { max-width: 100%; color: var(--danger); font-size: 14px; background: color-mix(in srgb, var(--danger) 10%, transparent); }
.typing { color: var(--muted); font-size: 14px; }
.composer {
  position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);
  display: flex; gap: 8px; align-items: flex-end;
  background: var(--bg); padding: 8px 0 0; margin-top: 8px;
}
.composer textarea { max-height: 140px; }
.composer button { flex: none; }
.plan-card { border: 2px solid var(--accent); }
.plan-day { margin-top: 10px; }
.plan-day b { display: block; margin-bottom: 2px; }
.plan-ex { font-size: 14px; display: flex; gap: 8px; padding: 3px 0; }
.plan-ex .s { margin-left: auto; color: var(--muted); white-space: nowrap; }

/* bottom nav */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs button {
  border: 0; background: transparent; border-radius: 0; min-height: var(--nav-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  font-size: 12px; color: var(--muted); padding: 6px 2px;
}
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--accent); font-weight: 700; }

/* rest timer */
#rest {
  position: fixed; left: 12px; right: 12px; z-index: 9;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 10px);
  max-width: 616px; margin: 0 auto;
  background: var(--text); color: var(--bg);
  border-radius: 16px; padding: 10px 12px;
  display: none; align-items: center; gap: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,.25);
}
#rest.show { display: flex; }
body.resting { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 90px); }
#rest .t { font-size: 26px; font-weight: 800; min-width: 72px; }
#rest button { background: transparent; color: var(--bg); border-color: color-mix(in srgb, var(--bg) 35%, transparent); min-height: 40px; padding: 6px 12px; }
#rest.over .t { color: var(--accent); }

/* sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: none; }
.sheet-bg.show { display: block; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 21;
  max-width: 640px; margin: 0 auto;
  background: var(--surface); border-radius: 18px 18px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  max-height: 85vh; overflow-y: auto;
  transform: translateY(100%); transition: transform .2s ease;
}
.sheet.show { transform: none; }
.sheet h3 { margin: 0 0 12px; font-size: 18px; }
.pick { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; padding: 12px 4px; }

/* chart */
.chart svg { width: 100%; height: auto; display: block; }
.chart .axis { stroke: var(--line); stroke-width: 1; }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .12; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart text { fill: var(--muted); font-size: 11px; }

table.pct { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.pct td, table.pct th { padding: 8px 4px; border-top: 1px solid var(--line); text-align: right; }
table.pct th { color: var(--muted); font-weight: 600; font-size: 13px; text-align: right; }
table.pct td:first-child, table.pct th:first-child { text-align: left; }

.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top) + 12px); transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; z-index: 30;
  font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw;
}
.toast.show { opacity: 1; }
</style>
</head>
<body>

<header class="top">
  <div>
    <h1 id="title">訓練</h1>
    <div class="sub" id="subtitle"></div>
  </div>
</header>

<main>
  <section class="view" id="v-workout"></section>
  <section class="view" id="v-body"></section>
  <section class="view" id="v-coach"></section>
  <section class="view" id="v-calc"></section>
  <section class="view" id="v-settings"></section>
</main>

<div id="rest">
  <div class="t num" id="rest-t">1:30</div>
  <div class="small" id="rest-l">休息中</div>
  <div class="spacer"></div>
  <button id="rest-minus">−15</button>
  <button id="rest-plus">+30</button>
  <button id="rest-skip">結束</button>
</div>

<nav class="tabs">
  <button data-tab="workout" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>訓練
  </button>
  <button data-tab="body">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>身體
  </button>
  <button data-tab="coach">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/><path d="M9 10h.01M12 10h.01M15 10h.01"/></svg>教練
  </button>
  <button data-tab="calc">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>計算
  </button>
  <button data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>個人
  </button>
</nav>

<div class="sheet-bg" id="sheet-bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
<script src="coach.js"></script>
<script>boot();</script>
</body>
</html>
